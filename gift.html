  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/animations.css" />

<body data-page="gift">

  <nav class="navbar">
    <a href="index.html" class="nav-logo">piupiu<span class="dot">.</span></a>
    <ul class="nav-links">

  <main class="page">
    <div class="page-content page-wide">
      <div class="section-head">
        <span class="section-num">05 / Little Treats for You</span>
        <h1 class="section-title">
          Your Little <span class="script">coupons</span>
        </h1>
        <p class="section-desc">
          Claim them whenever you want. No expiration date, promisee
        </p>
      </div>
      <div class="gift-grid" id="giftGrid"></div>
    </div>
  </main>

  <div class="gift-modal" id="giftModal" aria-hidden="true">
    <div class="gift-modal-backdrop" data-close></div>
    <div class="gift-modal-dialog" role="dialog" aria-modal="true">
      <button class="gift-modal-close" data-close aria-label="Close">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
          <line x1="18" y1="6" x2="6" y2="18"/>
          <line x1="6" y1="6" x2="18" y2="18"/>
        </svg>
      </button>

      <div class="gift-ticket" id="giftTicket">
        <div class="gift-ticket-head">
          <span class="gift-ticket-brand">piupiu · voucher</span>
          <span class="gift-ticket-code" id="modalCode">CODE-000</span>
        </div>

        <div class="gift-ticket-icon" id="modalIcon">🎁</div>

        <h3 class="gift-ticket-title" id="modalTitle">Voucher</h3>
        <p class="gift-ticket-desc" id="modalDesc">Deskripsi</p>

        <div class="gift-ticket-divider">
          <span class="gift-ticket-cut"></span>
          <span class="gift-ticket-dashes"></span>
          <span class="gift-ticket-cut"></span>
        </div>

        <div class="gift-ticket-barcode">
          <div class="gift-barcode" id="modalBarcode"></div>
          <span class="gift-ticket-serial" id="modalSerial">0000 0000 0000</span>
        </div>

        <div class="gift-ticket-foot">
          <div class="gift-ticket-meta">
            <span class="gift-ticket-meta-label">Status</span>
            <span class="gift-ticket-meta-value" id="modalStatus">Ready to claim</span>
          </div>
          <button class="gift-ticket-claim" id="modalClaim">
            <span id="modalClaimText">Claim voucher</span>
          </button>
        </div>
      </div>
    </div>
  </div>

  <div class="page-nav">
    <a href="letter.html" class="btn-prev">Back</a>
    <span class="page-progress">
      <span class="dot"></span>

  <button id="musicToggle" class="music-toggle"><span class="music-icon">♪</span></button>

  <script src="js/main.js"></script>
  <script src="js/gift.js"></script>
  <script src="js/pets.js"></script>
